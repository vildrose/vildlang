name: Docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: homeserver

    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 3

    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Install mdBook & D2 tools
        uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: mdbook,mdbook-d2,d2

      - name: Build Rust API documentation
        run: cargo doc --workspace --no-deps

      - name: Test mdBook
        run: mdbook test docs/

      - name: Build mdBook
        run: mdbook build docs/

      - name: Assemble static site
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf public
          mkdir -p public/book public/api

          # Copy root site landing assets if they exist
          if [ -d "docs/site" ]; then
            cp -R docs/site/. public/
          fi

          # Copy mdBook and rustdoc targets
          cp -R target/mdbook/. public/book/
          cp -R target/doc/. public/api/

          # Prevent Jekyll processing
          touch public/.nojekyll

      - name: Deploy to Codeberg Pages
        if: github.ref == 'refs/heads/main'
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://vildrose.codeberg.page/vildlang
          token: ${{ secrets.GITHUB_TOKEN }}
          source: public/
