[toolchain]
channel = "stable"
profile = "default"

components = [
  "rust-src",
  "rust-analyzer",
  "clippy",
  "rustfmt",
  "llvm-tools-preview",
]

targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-gnu",
  "aarch64-pc-windows-gnullvm",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "riscv64gc-unknown-linux-gnu",
]
